name: Gitee ⇄ GitHub 双向同步

# 规则：谁领先就推给谁；两边各有新提交就自动合并；合不干净就报错停下（谁都不动）。
# 往 Gitee 推需要仓库 secret：GITEE_TOKEN（Gitee 私人令牌，勾 projects 权限）。
# 没配这个 secret 时，Gitee → GitHub 单向照常工作，往 Gitee 推的那步会明确报错。

on:
  schedule:
    - cron: '*/30 * * * *'       # 每 30 分钟对一次（网页版检查更新走 GitHub 镜像，别拖太久）
  workflow_dispatch:
    inputs:
      force_from_gitee:
        description: 强制用 Gitee 覆盖 GitHub 的 master（首次导入 / 救援时才用）
        type: boolean
        default: false
  push:
    branches: [master]           # GitHub 上合并了 PR 就立刻同步回 Gitee

permissions:
  contents: write

concurrency:
  group: mirror-sync
  cancel-in-progress: false

jobs:
  sync:
    # 镜像自己推上来的那次不重复触发，避免自己触发自己
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 取出完整历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 判定方向并同步
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          FORCE_FROM_GITEE: ${{ inputs.force_from_gitee && '1' || '' }}
        run: python mirror_sync.py
